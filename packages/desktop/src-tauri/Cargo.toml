[package]
name = "offdesk-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

# `cdylib` is required by Tauri's mobile (Android/iOS) build, which loads
# the Rust code as a shared library from the JVM / ObjC runtime.
# `staticlib` is needed for iOS, `rlib` keeps normal binary builds working.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Its own root, not a member of the repo workspace: the root Cargo.toml
# excludes it, but cargo keeps walking up past a git worktree and finds the
# parent checkout's workspace instead. An empty table stops the walk.
[workspace]

[dependencies]
futures = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
offdesk-secure = { path = "../../../crates/secure" }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

# Mobile-only: the camera reads the hub's QR code so nothing is typed on a
# phone. Android and iOS ship the plugin's native view; there is no desktop
# counterpart.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Desktop-only plugins / runtime bits. Tray icon and global shortcuts make
# no sense on mobile; the loopback OAuth listener (axum/tokio-net) needs
# bind-to-port permission that mobile platforms restrict.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
axum = "0.8"
open = "5"

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3.7"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-offdesk-keystore = { path = "../keystore" }
