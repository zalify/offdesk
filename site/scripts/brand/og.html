<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;background:#0c0c0b;color:#ecebe6;font-family:"Geist Mono",monospace}
  .logo{position:absolute;left:72px;top:64px;height:48px}
  h1{position:absolute;left:72px;top:168px;margin:0;width:1000px;font-weight:600;font-size:68px;line-height:1.08;letter-spacing:-.035em}
  h1 i{display:inline-block;width:.55em;height:.9em;margin-left:.12em;vertical-align:-.1em;background:#d4ff3a}
  p{position:absolute;left:72px;top:356px;margin:0;width:900px;font-family:"Geist",sans-serif;font-size:27px;line-height:1.45;color:#aeaca6}
  .cmd{position:absolute;left:72px;top:462px;display:flex;gap:28px;font-size:22px;color:#aeaca6}
  .cmd b{color:#d4ff3a;font-weight:500}
  .status{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;gap:22px;padding:0 72px;background:#141413;border-top:1px solid #2a2927;font-size:19px;color:#8f8d87}
  .status .on{color:#0c0c0b;background:#d4ff3a;padding:2px 8px}
  .status .r{margin-left:auto;color:#aeaca6}
</style>
<div class="og">
  <img class="logo" src="logo-dark.svg">
  <h1>One terminal, shared by you and your <span style="white-space:nowrap">agents.<i></i></span></h1>
  <p>Any program in tmux, on all your machines, behind one hub you run. Open source, MIT.</p>
  <div class="cmd"><span><b>$</b> offdesk open</span><span>send</span><span>wait</span><span>read</span></div>
  <div class="status"><span>[offdesk]</span><span class="on">0:app*</span><span>1:nas</span><span>2:agent</span><span class="r">offdesk.dev</span></div>
</div>
