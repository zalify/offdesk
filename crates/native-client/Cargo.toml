[package]
name = "offdesk-native"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Pure-Rust GPU-accelerated native desktop client for Offdesk (powered by offdesk-native-term)"

[[bin]]
name = "offdesk-native"
path = "src/main.rs"

[dependencies]
offdesk-native-term = { path = "../native-term" }
offdesk-protocol = { path = "../protocol" }
winit = "0.30"
wgpu = "24"
arboard = "3"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
