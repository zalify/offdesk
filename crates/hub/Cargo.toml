[package]
name = "offdesk-hub"
version.workspace = true
edition = "2021"
license = "MIT"

[[bin]]
name = "offdesk-hub"
path = "src/main.rs"

[features]
# Bakes packages/app/dist into the binary so `offdesk-hub` serves the web UI
# with nothing beside it. Off by default: a plain `cargo build` must not
# require a built frontend. Release builds turn it on.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
offdesk-preview-transport = { path = "../preview-transport" }
tokio-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
url = "2"
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path"] }
mime_guess = { version = "2", optional = true }
offdesk-protocol = { path = "../protocol" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
rusqlite.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
jsonwebtoken.workspace = true
bcrypt.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest.workspace = true
thiserror.workspace = true
chrono.workspace = true
http.workspace = true
bytes.workspace = true
tokio-tungstenite.workspace = true
urlencoding = "2"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }

offdesk-secure = { path = "../secure" }
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
