# E2E test environment
# Usage:
#   docker compose -f e2e/docker-compose.yml up -d --build hub node
#   docker compose -f e2e/docker-compose.yml up --build --abort-on-container-exit --exit-code-from runner runner

services:
  hub:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.hub
    ports:
      # Host-side debug publish only — the runner talks to hub over the compose
      # network. Parameterized so parallel stacks (distinct COMPOSE_PROJECT_NAME
      # per session/worktree) don't fight over the host port.
      - "127.0.0.1:${E2E_HUB_HOST_PORT:-4317}:4317"
    environment:
      DATABASE_PATH: "/app/data/offdesk.db"
      OFFDESK_STATIC_DIR: "/app/web"
      OFFDESK_DEV_MODE: "true"
      JWT_SECRET: "e2e-test-secret"
      OFFDESK_BASE_URL: "http://hub:4317"
      OFFDESK_PREVIEW_DOMAIN: "preview.test"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Host: hub:4317' http://localhost:4317/api/auth/dev || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  node:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.node
    command:
      - offdesk-node
      - start
      - --hub-url
      - ws://hub:4317/ws/machine
      - --id
      - e2e-node
      - --name
      - e2e-machine
    environment:
      # Lets the fake ACP agent emit session/request_permission; sessions
      # created with auto_run=false then surface ask-cards in the chat view.
      FAKE_ACP_ASK: "1"
    depends_on:
      hub:
        condition: service_healthy

  preview-edge:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.preview-edge
    depends_on:
      hub:
        condition: service_healthy

  runner:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.runner
    ipc: host
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: "http://hub:4317"
      PLAYWRIGHT_PREVIEW_EDGE: "preview-edge"
    command: ["pnpm", "exec", "playwright", "test", "--grep", "${E2E_TEST_GREP:-.*}"]
    depends_on:
      hub:
        condition: service_healthy
      node:
        condition: service_started
      preview-edge:
        condition: service_started
    volumes:
      - ./artifacts:/work/e2e/artifacts
