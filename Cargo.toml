[workspace]
members = ["crates/*"]
exclude = ["packages/desktop/src-tauri"]
resolver = "2"

# What `offdesk --version` and `offdesk-node --version` print. Bump this
# before tagging a v* release; the tag and the binaries should agree.
[workspace.package]
version = "0.21.4"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
portable-pty = "0.9"
vt100 = "0.15"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.34", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.27"
jsonwebtoken = "9"
bcrypt = "0.16"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5"
thiserror = "2"
chrono = "0.4"
http = "1"
sysinfo = "0.33"
bytes = "1"
flate2 = "1"
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
