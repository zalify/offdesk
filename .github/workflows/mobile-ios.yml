name: Mobile (iOS)
# Builds the iOS app on an ios-v* tag and hands it to TestFlight.
#
# Signing lives in repository secrets, all from the Apple Developer account:
#
#   APPLE_DEVELOPMENT_TEAM    the 10-character Team ID (Membership details)
#   IOS_CERTIFICATE           an Apple Distribution certificate, .p12, base64
#   IOS_CERTIFICATE_PASSWORD  its password
#   IOS_MOBILE_PROVISION      an App Store provisioning profile for
#                             dev.offdesk.ios, .mobileprovision, base64
#   APP_STORE_CONNECT_KEY_ID  an App Store Connect API key (Users and Access
#   APP_STORE_CONNECT_ISSUER_ID   → Integrations → App Store Connect API), with
#   APP_STORE_CONNECT_API_KEY     the .p8 contents base64 — for the upload
#
# The Tauri CLI reads the first four itself and signs the archive with them;
# the upload is xcrun altool with the API key. The tag decides the version:
# ios-v0.4.5 builds 0.4.5.
on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:
    inputs:
      prebuilt_release:
        description: "Optional draft RC release containing ios-archive.zip (skip compilation)"
        type: string
      archive_sha256:
        description: "Required SHA256 of a prebuilt archive"
        type: string
      existing_build:
        description: "Only enable an already-uploaded RC build for internal testing"
        type: string

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    if: ${{ !inputs.prebuilt_release && !inputs.existing_build }}
    # App Store Connect only takes apps built against the iOS 26 SDK, which
    # means Xcode 26; macos-26 has it as the default Xcode.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Tauri CLI
        run: cargo install cargo-binstall --locked && cargo binstall -y tauri-cli --version "^2.0"

      - name: Build shared package
        run: pnpm --filter @offdesk/shared build

      - name: Build trusted web bundle (retained for encrypted connections)
        run: |
          pnpm --filter @offdesk/app build
          node scripts/stamp-build.mjs packages/app/dist "$GITHUB_REF_NAME"

      - name: Set release version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME:-ios-vlocal}"
          version="${tag#ios-v}"
          if [ "$version" = "$tag" ]; then version="0.1.0"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          missing=0
          for name in APPLE_DEVELOPMENT_TEAM IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION; do
            if [ -z "${!name}" ]; then
              echo "$name secret is required for iOS releases." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      # The Tauri CLI installs the profile under
      # ~/Library/MobileDevice/Provisioning Profiles, which is where Xcode
      # looked until 16. Xcode 16 looks in
      # ~/Library/Developer/Xcode/UserData/Provisioning Profiles, and a
      # profile it cannot see is "requires a provisioning profile" — so put
      # it where both look, under the name Xcode expects: its UUID.
      - name: Install the provisioning profile where Xcode looks
        env:
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          profile=$(mktemp)
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$profile"
          uuid=$(security cms -D -i "$profile" | plutil -extract UUID raw -)
          name=$(security cms -D -i "$profile" | plutil -extract Name raw -)
          for dir in ~/Library/MobileDevice/Provisioning\ Profiles \
                     ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          rm -f "$profile"
          echo "installed \"$name\" ($uuid)"

      - name: Build IPA
        working-directory: packages/desktop
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          cargo tauri ios build --export-method app-store-connect \
            --config "{\"version\": \"${{ steps.version.outputs.version }}\", \"bundle\": {\"iOS\": {\"developmentTeam\": \"$APPLE_DEVELOPMENT_TEAM\"}}}"

      # When signing fails, say why in terms a person can act on: what the
      # profile the CLI installed is for, and what the project ended up
      # asking for. None of this is secret — a profile's bundle id, team and
      # name are the same facts printed on its page in the developer portal.
      # When signing fails, reproduce the setup by hand and say what Xcode
      # sees. Nothing printed here is secret: a profile's bundle id, team and
      # name are on its page in the developer portal, and certificate hashes
      # are masked.
      - name: Signing diagnostics
        if: failure()
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set +e
          mask() { sed -E 's/[0-9A-F]{40}/<hash>/g'; }
          echo "== profiles Xcode can see"
          for dir in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            echo "-- $dir"; ls -la "$dir" 2>/dev/null
          done
          f=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          echo "== the profile, minus the certificate blobs"
          security cms -D -i "$f" | plutil -p - | grep -vE '^\s+[0-9]+ => <|DER-Encoded' | grep -vE '^\s+"(DeveloperCertificates|DER-Encoded-Profile)"' | mask

          echo "== the certificate, imported into a fresh keychain the way the CLI does it"
          kc=$RUNNER_TEMP/diag.keychain-db
          p12=$RUNNER_TEMP/diag.p12
          echo "$IOS_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p diagpass "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p diagpass "$kc"
          security import "$p12" -k "$kc" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k diagpass "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          echo "-- identities (before adding Apple's intermediate)"
          security find-identity -p codesigning "$kc" | mask
          echo "-- certificates in the keychain"
          security find-certificate -a -p "$kc" | openssl crl2pkcs7 -nocrl -certfile /dev/stdin | openssl pkcs7 -print_certs -noout | mask
          echo "-- adding Apple WWDR G3 + G4"
          for ca in AppleWWDRCAG3 AppleWWDRCAG4; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" && security import "$RUNNER_TEMP/$ca.cer" -k "$kc" -T /usr/bin/codesign > /dev/null 2>&1 && echo "   imported $ca"
          done
          echo "-- identities (after)"
          security find-identity -v -p codesigning "$kc" | mask

          echo "== effective build settings"
          cd packages/desktop/src-tauri/gen/apple
          xcodebuild -showBuildSettings -scheme offdesk-desktop_iOS -workspace offdesk-desktop.xcodeproj/project.xcworkspace -sdk iphoneos -configuration release 2>&1 \
            | grep -E "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|PLATFORM_NAME|SDK_NAME|\bCONFIGURATION\b" | mask

          security delete-keychain "$kc"
          rm -f "$p12"

      - name: Collect IPA
        id: ipa
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p artifacts
          src=$(find packages/desktop/src-tauri/gen/apple/build -name "*.ipa" | head -1)
          [ -n "$src" ] || { echo "no .ipa produced" >&2; exit 1; }
          cp "$src" "artifacts/offdesk-${version}.ipa"
          echo "path=artifacts/offdesk-${version}.ipa" >> "$GITHUB_OUTPUT"
          ls -lh artifacts/

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "App Store Connect API secrets not set; the IPA is on the release but not on TestFlight." >&2
            exit 0
          fi
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: iOS ${{ steps.version.outputs.tag }}
          body: |
            The offdesk iOS app, ${{ steps.version.outputs.version }}. Install it from TestFlight; the .ipa here is the same build, for the record.
          files: artifacts/*.ipa

  sign-prebuilt-rc:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prebuilt_release != '' && inputs.existing_build == '' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      # GitHub requires push access to read draft-release assets. This job
      # only downloads the private handoff; it never publishes the draft.
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download verified draft RC archive
        env:
          GH_TOKEN: ${{ github.token }}
          RC_RELEASE: ${{ inputs.prebuilt_release }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          [[ "$RC_RELEASE" == rc-ios-* ]]
          [[ "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(gh release view "$RC_RELEASE" --json isDraft --jq .isDraft)" = true
          gh release download "$RC_RELEASE" --pattern ios-archive.zip --dir "$RUNNER_TEMP/rc"
          cd "$RUNNER_TEMP/rc"
          printf '%s  ios-archive.zip\n' "$ARCHIVE_SHA256" | shasum -a 256 --check
          ditto -x -k ios-archive.zip .
      - name: Sign and upload RC to TestFlight only
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bash scripts/sign-ios-rc.sh "$RUNNER_TEMP/rc"
      - name: Enable existing internal TestFlight group
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: ruby scripts/testflight-internal.rb "$RUNNER_TEMP/rc/build-number.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-rc-testflight
          path: |
            ${{ runner.temp }}/rc/export/*.ipa
            ${{ runner.temp }}/rc/build-number.txt
          retention-days: 7

  distribute-existing-rc:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_build != '' && inputs.prebuilt_release == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Enable existing internal TestFlight group
        env:
          RC_BUILD: ${{ inputs.existing_build }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          printf '%s' "$RC_BUILD" > "$RUNNER_TEMP/build-number.txt"
          ruby scripts/testflight-internal.rb "$RUNNER_TEMP/build-number.txt"
