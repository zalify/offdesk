name: Site

# Builds site/ and deploys it to Cloudflare Workers static assets.
#
# Workers rather than Pages because that is what Cloudflare now recommends for
# new projects — Pages still works, but the investment goes to Workers:
# https://developers.cloudflare.com/workers/static-assets/migration-guides/migrate-from-pages/
#
# Nothing has to exist in the dashboard first. `wrangler deploy` creates the
# Worker on its first run, named by `name` in site/wrangler.toml.
#
# Secrets to set once, at Settings → Secrets and variables → Actions →
# New repository secret:
#
#   CLOUDFLARE_ACCOUNT_ID  the 32-hex id in the dashboard URL, right after
#                          dash.cloudflare.com/ — also in the right-hand
#                          sidebar of Workers & Pages.
#   CLOUDFLARE_API_TOKEN   My Profile → API Tokens → Create Token → the
#                          "Edit Cloudflare Workers" template. A custom token
#                          needs Account → Workers Scripts → Edit, and
#                          Account → Workers R2 Storage → Edit for the
#                          release mirror (worker.js binds its R2 bucket,
#                          scripts/mirror-release.mjs fills it).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v6

      # site/ is its own pnpm root (site/pnpm-workspace.yaml) so the app
      # workspace never has to install Astro.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site
          # wrangler-action v3 installs 3.90.0 by default, which parses
          # [assets] without complaint and then ignores it — it uploads a
          # Worker with no static files and reports success. Static assets
          # need 4.x.
          wranglerVersion: "4"
          command: deploy
