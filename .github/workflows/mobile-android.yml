name: Build Android APK (Tauri)

# release.yml calls this for every vX.Y.Z release: arm64 and x86_64 APKs plus a
# universal one, signed with the release key, started on an emulator, then
# uploaded into the release's draft. Dispatched by hand it builds an arm64 APK
# on the rc Web UI channel as a run artifact only.

on:
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z release tag to build and upload into (its draft release must exist)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      hub_url:
        description: "Optional: preset this hub instead of asking on first launch. Leave empty for a public build."
        required: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      # Empty on purpose for released builds: the app asks for a hub on first
      # launch, so one APK works for everyone. A dispatch can preset a hub for
      # a private build.
      OFFDESK_MOBILE_HUB_URL: ${{ inputs.hub_url }}
      # Baked in at compile time so the shell only loads Web UI bundles signed
      # with this key. The channel is chosen after the release source is known.
      OFFDESK_UI_PUBLIC_KEY: ${{ vars.OFFDESK_UI_PUBLIC_KEY }}

    steps:
      # The workflow's own commit first, for the smoke test below; the
      # release's tag is checked out after it.
      - uses: actions/checkout@v4

      - name: Preserve workflow smoke test
        run: cp scripts/android-startup-smoke.py "$RUNNER_TEMP/android-startup-smoke.py"

      - name: Validate release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PRESET_HUB: ${{ inputs.hub_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${RELEASE_TAG:-}"
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
            [ -z "$PRESET_HUB" ] || { echo "Public releases cannot preset a Hub" >&2; exit 1; }
            [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ] || { echo "Release builds upload into an unpublished draft release" >&2; exit 1; }
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git checkout --detach "refs/tags/$tag"
          fi
          git rev-parse HEAD
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Choose the Web UI channel
        run: |
          if [ -z "$OFFDESK_UI_PUBLIC_KEY" ]; then
            echo "The OFFDESK_UI_PUBLIC_KEY repository variable is required; without it the app cannot accept Web UI updates." >&2
            exit 1
          fi
          # Release tags follow the stable channel; ad-hoc builds follow rc.
          if [ -n "${{ steps.source.outputs.tag }}" ]; then channel=stable; else channel=rc; fi
          echo "OFFDESK_UI_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Decide which ABIs to build
        id: abi
        run: |
          # A release ships arm64 for phones and x86_64 for emulators.
          # armeabi-v7a and x86 are 32-bit, each costs a quarter of the Rust
          # build, and ad-hoc builds need only arm64. Releases also get the
          # emulator verification.
          if [ -n "${{ steps.source.outputs.tag }}" ]; then
            {
              echo 'rust=aarch64-linux-android,x86_64-linux-android'
              echo 'tauri=-t aarch64 -t x86_64'
              echo 'gradle="arm64-v8a", "x86_64"'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'rust=aarch64-linux-android'
              echo 'tauri=-t aarch64'
              echo 'gradle="arm64-v8a"'
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.1.12297006"

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.abi.outputs.rust }}

      # Gradle's own rust task shells out to `cargo tauri` for every ABI
      # (gen/android/buildSrc BuildTask.kt hardcodes it), so cargo-tauri has
      # to be on PATH no matter what invokes the outer build. It just does
      # not have to be compiled from source every run, which is what
      # `cargo install tauri-cli` was doing for 3.8 of this workflow's 10
      # minutes. binstall fetches the release binary; the fallback is there
      # because a slow build beats a broken one. The version must match the
      # @tauri-apps/cli in pnpm-lock.yaml that runs the outer build: 2.12.1
      # reads a handoff file 2.10.1 never writes. Bump both together.
      - uses: cargo-bins/cargo-binstall@main

      - name: Install the Tauri CLI
        run: |
          cargo binstall -y tauri-cli --version "=2.10.1" \
            || cargo install tauri-cli --version "=2.10.1" --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          # Keyed on the ABI set: a dispatch build and a tag build compile
          # different targets and should not evict each other.
          key: android-${{ steps.abi.outputs.rust }}

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile=false

      - name: Build shared package
        run: pnpm --filter @offdesk/shared build

      - name: Build trusted web bundle (retained for encrypted connections)
        run: |
          pnpm --filter @offdesk/app build
          node scripts/stamp-build.mjs packages/app/dist "${{ steps.source.outputs.tag || github.ref_name }}"

      - name: Set release version from tag
        id: version
        run: |
          tag="${{ steps.source.outputs.tag }}"
          if [ -n "$tag" ]; then
            version="${tag#v}"
          else
            version="0.1.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        working-directory: packages/desktop/src-tauri/gen/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name secret is required for Android releases." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      # Inject the release signing config + per-ABI splits. Mirrors the
      # patch the old Expo workflow applied; build.gradle.kts on the Tauri
      # template doesn't ship a signing block we can fill via env alone.
      - name: Patch app/build.gradle.kts (signing + ABI splits)
        working-directory: packages/desktop/src-tauri/gen/android
        run: |
          python3 - <<'PY'
          import re, pathlib
          path = pathlib.Path("app/build.gradle.kts")
          src = path.read_text()

          signing_block = """
              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                  }
              }
          """
          src = re.sub(r"android\s*\{", "android {" + signing_block, src, count=1)

          # Hook the release buildType to use our signingConfig. The
          # generated template's release block already declares a
          # `signingConfig signingConfigs.getByName("debug")` line we can
          # swap for ours.
          new_src, n = re.subn(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("release")',
              src,
              count=1,
          )
          if n == 0:
              # Older templates: just inject one inside release { ... }
              new_src, n = re.subn(
                  r'getByName\("release"\)\s*\{',
                  'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")',
                  src,
                  count=1,
              )
              if n == 0:
                  raise SystemExit("Couldn't find release buildType to patch")
          src = new_src

          # Per-ABI splits — universal APK plus one per ABI keeps each
          # file ~50MB instead of one ~190MB blob.
          splits_block = """
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include(${{ steps.abi.outputs.gradle }})
                      isUniversalApk = true
                  }
              }
          """
          src = src.replace("android {" + signing_block,
                            "android {" + signing_block + splits_block,
                            1)

          path.write_text(src)
          print("Patched build.gradle.kts")
          PY

      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        working-directory: packages/desktop
        run: |
          # The tag decides the version. Writing gen/android/app/tauri.properties
          # by hand does not work: the CLI regenerates that file from the
          # config on every build, which is why every APK so far has reported
          # 0.3.14 whatever it was tagged. --config merges into tauri.conf.json
          # before that happens, and the CLI derives versionCode from it
          # (0.4.0 -> 4000), so upgrades stay monotonic.
          cargo tauri android build --apk \
            ${{ steps.abi.outputs.tauri }} \
            --config "{\"version\": \"${{ steps.version.outputs.version }}\"}"

      - name: Collect APKs
        id: apks
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p artifacts
          while IFS= read -r src; do
            base=$(basename "$src" .apk)
            # Gradle names these app-<flavor>-<abi>-release.apk, and the
            # flavor is itself called "universal", so the raw strip leaves
            # "universal-arm64-v8a". Drop the flavor, keep the real ABI —
            # and leave the genuinely universal APK named "universal".
            abi=$(echo "$base" | sed -E 's/^app-//; s/-release.*$//; s/^universal-(.+)$/\1/')
            [ -z "$abi" ] && abi="universal"
            cp "$src" "artifacts/offdesk-${version}-${abi}.apk"
          done < <(find packages/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*-release*.apk")
          ls -lh artifacts/
          {
            echo "files<<EOF"
            ls artifacts/*.apk
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offdesk-android-apks
          path: artifacts/*.apk

      - name: Enable emulator acceleration
        if: steps.source.outputs.tag != ''
        run: sudo chmod a+rw /dev/kvm

      - name: Verify signed release APK starts before publishing
        if: steps.source.outputs.tag != ''
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: python3 "$RUNNER_TEMP/android-startup-smoke.py" artifacts/offdesk-${{ steps.version.outputs.version }}-x86_64.apk

      - name: Upload startup evidence
        if: always() && steps.source.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-release-startup-evidence
          path: /tmp/offdesk-android-startup

      - name: Upload to the release
        if: steps.source.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
        run: gh release upload "$TAG" artifacts/*.apk --clobber
