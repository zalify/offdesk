name: Desktop Build

# The desktop app for macOS (universal), Windows and Linux. release.yml calls
# this for every vX.Y.Z release, and tauri-action uploads the installers, the
# updater bundles with their .sig files and latest.json into that release's
# draft. Dispatched by hand it builds on the rc Web UI channel and keeps the
# installers as run artifacts only.

on:
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z release tag to build and upload into"
        required: true
        type: string
      release_id:
        description: "The id of that tag's draft release"
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux ship offdesk-hub and offdesk-node inside the app
        # (macOS tmux too), so the app can make its machine the hub. The
        # sidecar list lives in a config the release build merges in, so a
        # plain `tauri dev` needs none of them. Windows is a client only.
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin --config src-tauri/tauri.sidecars.macos.conf.json"
            sidecars: "--universal"
          - platform: ubuntu-22.04
            args: "--config src-tauri/tauri.sidecars.linux.conf.json"
            sidecars: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      # Baked in at compile time so the shell only loads Web UI bundles signed
      # with this key. Releases follow the stable channel; manual builds rc.
      OFFDESK_UI_PUBLIC_KEY: ${{ vars.OFFDESK_UI_PUBLIC_KEY }}
      OFFDESK_UI_CHANNEL: ${{ inputs.tag && 'stable' || 'rc' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Require the Web UI release public key
        shell: bash
        run: |
          if [ -z "$OFFDESK_UI_PUBLIC_KEY" ]; then
            echo "The OFFDESK_UI_PUBLIC_KEY repository variable is required; without it the app cannot accept Web UI updates." >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The hub sidecar bakes the web UI in, so the UI is built before it;
      # tauri-action's beforeBuildCommand builds it again, to the same result.
      - name: Build the web UI for the hub sidecar
        if: matrix.platform != 'windows-latest'
        run: pnpm --filter @offdesk/desktop build:web

      - name: Build the offdesk-hub and offdesk-node sidecars
        if: matrix.platform != 'windows-latest'
        run: scripts/desktop-sidecars.sh ${{ matrix.sidecars }}

      - name: Build the tmux sidecar
        if: matrix.platform == 'macos-latest'
        run: scripts/build-tmux-sidecar.sh packages/desktop/src-tauri/binaries

      # macOS signing and notarization. All four secrets present: the app,
      # its sidecars and the dmg are signed with the Developer ID certificate
      # and notarized through the App Store Connect key the iOS workflow
      # already uses (APPLE_API_KEY_PATH is that key written to disk). Any of
      # them missing: an unsigned build, as before — never a half-signed one.
      #   APPLE_DEVELOPER_ID_CERTIFICATE      Developer ID Application .p12, base64
      #   APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
      #   APP_STORE_CONNECT_API_KEY / _KEY_ID / _ISSUER_ID   (shared with iOS)
      #   APPLE_DEVELOPMENT_TEAM              the Team ID (shared with iOS)
      - name: Prepare macOS signing
        if: matrix.platform == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$CERT" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$API_KEY" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER" ] || [ -z "$TEAM" ]; then
            echo "Signing secrets are not all set; building unsigned."
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          echo "$API_KEY" | base64 --decode > "$key"
          # The identity's name is read off the certificate itself, so the
          # secret only has to be the .p12.
          p12="$RUNNER_TEMP/developer-id.p12"
          echo "$CERT" | base64 --decode > "$p12"
          identity=$(openssl pkcs12 -in "$p12" -passin "pass:$CERT_PASSWORD" -nokeys -clcerts -legacy 2>/dev/null \
            | openssl x509 -noout -subject -nameopt sep_multiline,utf8 2>/dev/null | sed -n 's/^ *CN=//p' | head -1)
          if [ -z "$identity" ]; then
            identity=$(openssl pkcs12 -in "$p12" -passin "pass:$CERT_PASSWORD" -nokeys -clcerts 2>/dev/null \
              | openssl x509 -noout -subject -nameopt sep_multiline,utf8 2>/dev/null | sed -n 's/^ *CN=//p' | head -1)
          fi
          [ -n "$identity" ] || { echo "Could not read the certificate's name from the .p12" >&2; exit 1; }
          echo "Signing as: $identity"
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_TEAM_ID=$TEAM"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY=$API_KEY_ID"
            echo "APPLE_API_KEY_PATH=$key"
          } >> "$GITHUB_ENV"

      # With releaseId, tauri-action uploads into release.yml's draft instead
      # of creating a release; tagName is still passed (literally — no
      # __VERSION__ template applies with releaseId) because latest.json
      # rewrites the draft's untagged-… download links to /download/<tag>/.
      # Each matrix job merges its platforms into the latest.json already on
      # the release, which tauri-action finds among the first 50 assets only
      # (a release holds about 30). Without either input (a manual build) it
      # uploads nothing.
      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          # Keep Finder layout even though the release runs in CI mode.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.tag }}
          # The notes in latest.json.
          releaseBody: "See the assets to download the desktop app for your platform."
          args: ${{ matrix.args }}

      - name: Verify macOS drag-to-install layout
        if: matrix.platform == 'macos-latest'
        run: |
          for dmg in packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            scripts/verify-dmg-layout.sh "$dmg"
          done

      - name: Keep the installers of a manual build
        if: ${{ !inputs.tag }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            packages/desktop/src-tauri/target/**/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz
            packages/desktop/src-tauri/target/**/bundle/msi/*.msi
            packages/desktop/src-tauri/target/**/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/**/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/**/bundle/deb/*.deb
            packages/desktop/src-tauri/target/**/bundle/rpm/*.rpm
