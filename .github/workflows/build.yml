name: Build & Release

# The CLI, the node agent and the hub, for Linux and macOS on x64 and arm64.
# release.yml calls this for every vX.Y.Z release and the binaries go into
# that release; dispatched by hand it builds them as run artifacts only.

on:
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z release tag to build and upload into (its draft release must exist)"
        required: true
        type: string
  workflow_dispatch:

jobs:
  web-bundle:
    # offdesk-hub bakes the web UI into the binary, and it is the same bundle
    # on every target — built once here rather than four times in the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @offdesk/shared build
      - run: cd packages/app && npx expo export --platform web
      # Metro's entry chunk keeps its filename while its contents change, so
      # without this a browser that cached one is pinned to an old chunk map.
      - run: node scripts/stamp-build.mjs packages/app/dist "${{ inputs.tag || github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: packages/app/dist

  build:
    needs: web-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x64
            use-cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-arm64
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x64
            use-cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
            use-cross: false

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: packages/app/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@cross

      # All three, or the installer only half works: it takes the CLI, the
      # agent and the hub from the same release, and a missing asset is a
      # failed install. embed-ui bakes the web bundle into offdesk-hub so it
      # runs with nothing beside it.
      - name: Build offdesk, offdesk-node and offdesk-hub
        run: |
          builder=cargo
          if [ "${{ matrix.use-cross }}" = "true" ]; then builder=cross; fi
          $builder build --release --target ${{ matrix.target }} \
            --bin offdesk --bin offdesk-node
          $builder build --release --target ${{ matrix.target }} \
            --bin offdesk-hub --features offdesk-hub/embed-ui

      - name: Name the binaries for the release
        run: |
          for name in offdesk offdesk-node offdesk-hub; do
            cp "target/${{ matrix.target }}/release/$name" "$name-${{ matrix.platform }}"
          done

      - name: Upload to the release
        if: inputs.tag
        run: |
          gh release upload "$TAG" \
            offdesk-${{ matrix.platform }} \
            offdesk-node-${{ matrix.platform }} \
            offdesk-hub-${{ matrix.platform }} \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offdesk-${{ matrix.platform }}
          path: |
            offdesk-${{ matrix.platform }}
            offdesk-node-${{ matrix.platform }}
            offdesk-hub-${{ matrix.platform }}
