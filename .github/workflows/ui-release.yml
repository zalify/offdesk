name: Publish Web UI

on:
  pull_request:
    paths:
      - '.github/workflows/ui-release.yml'
      - 'scripts/ui-updates/package*'
      - 'scripts/ui-updates/rollback.mjs'
      - 'scripts/mirror-release*'
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [rc, stable]
        default: rc
        description: UI channel (existing compatible shells only)

permissions:
  contents: write

concurrency:
  group: ui-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      UI_CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cargo test -p offdesk-ui-updates --locked
      - run: node --test scripts/ui-updates/package.test.mjs scripts/mirror-release.test.mjs
      - name: Container browser regression
        env:
          E2E_TEST_GREP: 'UI updates'
        run: pnpm e2e:ci
      - name: Build Web UI
        run: pnpm build
      - name: Sign immutable UI release
        if: github.event_name == 'workflow_dispatch'
        env:
          OFFDESK_UI_SIGNING_KEY: ${{ secrets.OFFDESK_UI_SIGNING_KEY }}
          EXPECTED_KEY: ${{ vars.OFFDESK_UI_PUBLIC_KEY }}
        run: |
          version="${UI_CHANNEL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sequence="$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))"
          node scripts/stamp-build.mjs packages/app/dist "ui-$version"
          node scripts/ui-updates/package.mjs packages/app/dist ui-release "$version" "$sequence" "$UI_CHANNEL" > ui-release-meta.json
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("ui-release-meta.json")); if (!process.env.EXPECTED_KEY || m.publicKey !== process.env.EXPECTED_KEY) throw new Error("UI signing key does not match the shell key");'
          echo "UI_VERSION=$version" >> "$GITHUB_ENV"
      # Each channel is one release (ui-stable, ui-rc) that holds its bundles,
      # each bundle's signed manifest (for rollback), and latest.json, the
      # pointer the apps read. The bundle goes up before the pointer moves.
      - name: Publish the bundle, then move the channel pointer
        if: github.event_name == 'workflow_dispatch'
        run: |
          release="ui-$UI_CHANNEL"
          if ! gh release view "$release" >/dev/null 2>&1; then
            gh release create "$release" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Web UI $UI_CHANNEL channel" \
              --notes "Signed Web UI bundles for the apps' $UI_CHANNEL channel, and latest.json, the manifest they follow. Not an app release: the apps update their interface from here on their own."
          fi
          cp ui-release/bundle.json "ui-release/bundle-$UI_VERSION.json"
          cp ui-release/latest.json "ui-release/manifest-$UI_VERSION.json"
          gh release upload "$release" "ui-release/bundle-$UI_VERSION.json" "ui-release/manifest-$UI_VERSION.json"
          gh release upload "$release" ui-release/latest.json --clobber
      # Keep the ten newest bundles (rollback targets) and never the one the
      # pointer names; older bundles and their manifests are removed.
      - name: Prune old bundles
        if: github.event_name == 'workflow_dispatch'
        run: |
          release="ui-$UI_CHANNEL"
          gh release view "$release" --json assets --jq '.assets | map(select(.name | startswith("bundle-"))) | sort_by(.createdAt) | reverse | .[10:] | .[].name' |
            while read -r bundle; do
              [ "$bundle" = "bundle-$UI_VERSION.json" ] && continue
              version="${bundle#bundle-}"; version="${version%.json}"
              gh release delete-asset "$release" "$bundle" --yes
              gh release delete-asset "$release" "manifest-$version.json" --yes || true
            done
      # offdesk.dev keeps a copy of the channel release and its own signed
      # pointer, updates/ui/<channel>/latest.json, which links the copy:
      # shells released after 0.24.0 ask there first (github.com is unreliable from
      # mainland China) and GitHub second. The pointer goes up only once its
      # bundle has. Without the CLOUDFLARE_API_TOKEN secret this warns and
      # skips; a failed upload fails the run.
      - name: Mirror the bundle and its pointer to offdesk.dev
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/mirror-release.mjs "ui-$UI_CHANNEL" --ui-pointer "$UI_CHANNEL=ui-release/mirror-latest.json"
