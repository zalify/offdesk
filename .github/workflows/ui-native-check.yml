name: Web UI native smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/ui-updates/**'
      - 'packages/desktop/src-tauri/src/ui_updates.rs'
      - 'packages/desktop/src-tauri/src/lib.rs'
      - 'packages/desktop/src-tauri/Cargo.*'
      - 'packages/desktop/src-tauri/build.rs'
      - 'packages/desktop/src-tauri/capabilities/**'
      - 'packages/app/lib/uiUpdates*'
      - 'packages/app/components/UiUpdateNotification.tsx'
      - 'packages/app/app/_layout.tsx'
      - 'scripts/ui-updates/**'
      - '.github/workflows/ui-native-check.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.1.12297006'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli --version '^2.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          key: ui-native-android
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare ephemeral signed UI fixtures
        run: |
          node scripts/stamp-build.mjs packages/app/dist ui-smoke-base
          node scripts/ui-updates/prepare-smoke.mjs packages/app/dist /tmp/offdesk-ui-fixtures
          echo "OFFDESK_UI_PUBLIC_KEY=$(cat /tmp/offdesk-ui-fixtures/public-key.txt)" >> "$GITHUB_ENV"
          echo 'OFFDESK_UI_CHANNEL=rc' >> "$GITHUB_ENV"
      - name: Build the single test APK
        working-directory: packages/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: cargo tauri android build --debug --apk -t x86_64
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: python3 scripts/ui-updates/android-smoke.py $(find packages/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*debug.apk' | head -1) /tmp/offdesk-ui-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-native-android-evidence
          path: /tmp/offdesk-ui-android-evidence
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          key: ui-native-macos
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare ephemeral signed UI fixtures
        run: |
          node scripts/stamp-build.mjs packages/app/dist ui-smoke-base
          node scripts/ui-updates/prepare-smoke.mjs packages/app/dist /tmp/offdesk-ui-fixtures
          echo "OFFDESK_UI_PUBLIC_KEY=$(cat /tmp/offdesk-ui-fixtures/public-key.txt)" >> "$GITHUB_ENV"
          echo 'OFFDESK_UI_CHANNEL=rc' >> "$GITHUB_ENV"
      - name: Build isolated Mac test app
        run: pnpm --filter @offdesk/desktop tauri build --debug --bundles app --config /tmp/offdesk-ui-fixtures/tauri.smoke.conf.json
      - name: Exercise native asset loading and rollback
        run: python3 scripts/ui-updates/macos-smoke.py 'packages/desktop/src-tauri/target/debug/bundle/macos/Offdesk UI Smoke.app' /tmp/offdesk-ui-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-native-macos-evidence
          path: |
            /tmp/offdesk-ui-fixtures/macos-*.json
            /tmp/offdesk-ui-fixtures/macos-native.log
