name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  changes:
    name: Change Scope
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      site: ${{ steps.scope.outputs.site }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test CI routing
        run: node --test scripts/ci/changed-scope.test.mjs
      - name: Classify changed paths
        id: scope
        run: node scripts/ci/changed-scope.mjs

  site-check:
    name: Site Build and Links
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install site dependencies
        run: pnpm --dir site install --frozen-lockfile
      - name: Check download redirects and installer
        run: node --test site/worker.test.mjs site/install.test.mjs
      - name: Build website
        run: pnpm --dir site build

  rust-check:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --workspace
      - run: cargo test -p offdesk-secure -p offdesk-hub -p offdesk-protocol -p offdesk-machine -p offdesk-preview-transport

  native-check:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Native Encryption Check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - run: cargo check --manifest-path packages/desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --lib mobile_shell
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --lib secure::route_tests
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --lib bundle_name
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --lib hub_version
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --lib workspace_version
      - run: cargo check --manifest-path packages/desktop/src-tauri/Cargo.toml --target aarch64-apple-ios

  frontend-build:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @offdesk/shared build
      - run: pnpm typecheck
      - run: pnpm test

      - run: cd packages/app && npx expo export --platform web

  # The Rust binaries the E2E images run, compiled once per change to the
  # Rust sources (or their build stage) and cached by that content: a change
  # that leaves crates/ alone reuses them instead of compiling for minutes.
  e2e-binaries:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: E2E Rust Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: cache
        uses: actions/cache@v4
        with:
          path: e2e/.prebuilt
          key: e2e-rust-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'e2e/Dockerfile.hub', 'e2e/Dockerfile.hub.dockerignore') }}

      # The same Dockerfile stage `pnpm e2e:test` compiles in, for both
      # binaries in one cargo build.
      - name: Compile hub and node
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker buildx build -f e2e/Dockerfile.hub --target rust-binaries \
            --build-arg E2E_CARGO_BINS="--bin offdesk-hub --bin offdesk-node" \
            --output type=local,dest=e2e/.prebuilt .
          test -x e2e/.prebuilt/offdesk-hub && test -x e2e/.prebuilt/offdesk-node

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-rust-binaries
          path: e2e/.prebuilt/
          # upload-artifact skips dot-directories unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The suite in four slices on separate runners, each with its own hub and
  # node (the tests share one machine, so a single stack runs them serially).
  e2e:
    needs: [changes, e2e-binaries]
    if: needs.changes.outputs.runtime == 'true'
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: e2e-rust-binaries
          path: e2e/.prebuilt

      # Artifacts drop the executable bit.
      - run: chmod +x e2e/.prebuilt/offdesk-hub e2e/.prebuilt/offdesk-node

      - run: pnpm e2e:ci
        env:
          E2E_RUST_BINARIES: prebuilt
          E2E_SHARD: ${{ matrix.shard }}/4

  android-check:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Android Updater Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: cargo-bins/cargo-binstall@main
      # Gradle's BuildTask calls back into `cargo tauri`, which must match the
      # @tauri-apps/cli in pnpm-lock.yaml: 2.12.1 reads a handoff file 2.10.1
      # never writes. Bump both together.
      - run: cargo binstall -y tauri-cli --version "=2.10.1" || cargo install tauri-cli --version "=2.10.1" --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      # Gradle's distribution, dependencies and compiled build scripts: without
      # them every run spent ~2 min before Gradle reached the Rust build. Only
      # main writes this cache; pull requests read it.
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build Android debug APK including native updater
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm --filter @offdesk/desktop exec tauri android build --debug --apk -t aarch64 -t x86_64 --config src-tauri/tauri.android.conf.json
      - name: Test Android release selection
        working-directory: packages/desktop/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-offdesk-android-updater:testDebugUnitTest
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test actual APK startup and WebView input
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: python3 scripts/android-startup-smoke.py packages/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-evidence
          path: /tmp/offdesk-android-startup

  ci-result:
    name: CI Result
    if: always()
    needs: [changes, site-check, rust-check, native-check, frontend-build, e2e-binaries, e2e, android-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          if (jobs.changes.result !== 'success') throw new Error('Change detection failed');
          for (const key of ['site', 'runtime']) {
            if (!['true', 'false'].includes(jobs.changes.outputs[key])) throw new Error(`Invalid ${key} scope`);
          }
          const expected = {
            'site-check': jobs.changes.outputs.site === 'true',
            ...Object.fromEntries(['rust-check', 'native-check', 'frontend-build', 'e2e-binaries', 'e2e', 'android-check']
              .map(name => [name, jobs.changes.outputs.runtime === 'true'])),
          };
          for (const [name, required] of Object.entries(expected)) {
            const wanted = required ? 'success' : 'skipped';
            if (jobs[name].result !== wanted) throw new Error(`${name}: ${jobs[name].result}, expected ${wanted}`);
          }
          console.log('All applicable checks passed.');
          NODE
