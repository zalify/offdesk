services:
  server:
    image: ghcr.io/zalify/offdesk-hub:main
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - offdesk-data:/app/data
    environment:
      DATABASE_PATH: "/app/data/offdesk.db"
      OFFDESK_STATIC_DIR: "/app/web"
      JWT_SECRET: "${JWT_SECRET}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      OFFDESK_BASE_URL: "${OFFDESK_BASE_URL}"
      OFFDESK_PREVIEW_DOMAIN: "${OFFDESK_PREVIEW_DOMAIN:-}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Reaches the hub from outside without opening a port, for a hub at home
  # behind NAT or CGNAT. Off unless you ask for it:
  #   docker compose --profile tunnel up -d
  # Create the tunnel in the Cloudflare Zero Trust dashboard, point its public
  # hostname at http://server:4317, and put its token in .env as TUNNEL_TOKEN.
  # Note that TLS terminates at Cloudflare: it can see your terminal traffic in
  # the clear. See docs/setup-public.md for what that means and what the
  # alternatives are.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN}"
    depends_on:
      - server

volumes:
  offdesk-data:
